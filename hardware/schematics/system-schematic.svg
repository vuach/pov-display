<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }
    .section { font-size: 23px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 600; }
    .small { font-size: 15px; }
    .box { fill: #f7f9fc; stroke: #607086; stroke-width: 2; rx: 14; }
    .warn { fill: #fff4e5; stroke: #e67e22; stroke-width: 2; rx: 12; }
    .power { stroke: #1687ff; stroke-width: 5; fill: none; }
    .gnd { stroke: #4d5968; stroke-width: 5; fill: none; }
    .signal { stroke: #17a668; stroke-width: 4; fill: none; }
    .motor { stroke: #e53935; stroke-width: 5; fill: none; }
    .thin { stroke-width: 2.5; }
  </style>

  <rect width="1600" height="1050" fill="white"/>
  <text x="55" y="58" class="title">ESP32 POV — актуальная двухлопастная схема</text>
  <text x="55" y="90" class="small">2 × 150 мм · первая сборка 2 × 20 APA102 · шестиканальное кольцо · ревизия 2026-09-21</text>

  <text x="55" y="145" class="section">Неподвижная часть</text>
  <rect x="55" y="175" width="170" height="90" class="box"/>
  <text x="140" y="212" text-anchor="middle" class="label">Li-Po 3S</text>
  <text x="140" y="239" text-anchor="middle" class="small">11,1 В · XT60</text>

  <rect x="275" y="175" width="155" height="90" class="box"/>
  <text x="352" y="212" text-anchor="middle" class="label">F1 + SW</text>
  <text x="352" y="239" text-anchor="middle" class="small">предохранитель</text>

  <rect x="500" y="135" width="185" height="90" class="box"/>
  <text x="592" y="172" text-anchor="middle" class="label">ESC 30 A</text>
  <text x="592" y="199" text-anchor="middle" class="small">BEC +5 В: NC</text>

  <rect x="760" y="135" width="205" height="90" class="box"/>
  <text x="862" y="172" text-anchor="middle" class="label">A2212 1000KV</text>
  <text x="862" y="199" text-anchor="middle" class="small">1400KV не ставить</text>

  <rect x="500" y="265" width="185" height="90" class="box"/>
  <text x="592" y="302" text-anchor="middle" class="label">F2 + MP1584</text>
  <text x="592" y="329" text-anchor="middle" class="small">5,00 В · нагрузочный тест</text>

  <path d="M225 220 H275" class="motor"/>
  <path d="M430 205 H500" class="motor"/>
  <path d="M685 180 H760" class="motor"/>
  <text x="715" y="166" class="small">U/V/W</text>
  <path d="M430 235 H465 V310 H500" class="power"/>

  <text x="1030" y="145" class="section">Кольцо</text>
  <rect x="1030" y="170" width="210" height="255" class="box"/>
  <text x="1135" y="202" text-anchor="middle" class="label">6 каналов</text>
  <text x="1055" y="242" class="small">1 + 2 → +5 В</text>
  <text x="1055" y="280" class="small">3 + 4 → GND</text>
  <text x="1055" y="318" class="small">5 → ESC PWM</text>
  <text x="1055" y="356" class="small">6 → резерв / NC</text>
  <text x="1055" y="395" class="small">ток канала: TBD</text>

  <path d="M685 300 H1030" class="power"/>
  <text x="820" y="289" class="small">5V_STATOR</text>
  <path d="M1030 318 H720 V220 H685" class="signal"/>
  <text x="748" y="372" class="small">PWM к ESC</text>

  <line x1="50" y1="465" x2="1550" y2="465" stroke="#cbd3df" stroke-width="2"/>
  <text x="55" y="515" class="section">Вращающаяся часть</text>

  <rect x="70" y="560" width="255" height="250" class="box"/>
  <text x="197" y="600" text-anchor="middle" class="label">ESP32 DevKit V1</text>
  <text x="95" y="642" class="small">VIN ← 5V_ROTOR</text>
  <text x="95" y="676" class="small">GPIO18 → DATA A</text>
  <text x="95" y="710" class="small">GPIO19 → CLOCK A</text>
  <text x="95" y="744" class="small">GPIO23 → DATA B</text>
  <text x="95" y="778" class="small">GPIO22 → CLOCK B</text>
  <text x="95" y="804" class="small">GPIO25 → ESC PWM</text>

  <rect x="70" y="850" width="255" height="100" class="box"/>
  <text x="197" y="888" text-anchor="middle" class="label">KY-003</text>
  <text x="95" y="920" class="small">3V3 · GND · OUT → GPIO27</text>

  <rect x="425" y="550" width="300" height="310" class="box"/>
  <text x="575" y="592" text-anchor="middle" class="label">SN74AHCT125N · 5 В</text>
  <text x="452" y="632" class="small">1: pins 2→3 · DATA A</text>
  <text x="452" y="668" class="small">2: pins 5→6 · CLOCK A</text>
  <text x="452" y="704" class="small">3: pins 9→8 · DATA B</text>
  <text x="452" y="740" class="small">4: pins 12→11 · CLOCK B</text>
  <text x="452" y="784" class="small">OE 1/4/10/13 → GND</text>
  <text x="452" y="820" class="small">100 нФ между pins 14/7</text>

  <rect x="850" y="540" width="300" height="175" class="box"/>
  <text x="1000" y="582" text-anchor="middle" class="label">Лопасть A</text>
  <text x="875" y="620" class="small">до 150 мм · 20 APA102</text>
  <text x="875" y="654" class="small">DATA: 330–470 Ом</text>
  <text x="875" y="688" class="small">CLOCK: 330–470 Ом</text>

  <rect x="850" y="760" width="300" height="175" class="box"/>
  <text x="1000" y="802" text-anchor="middle" class="label">Лопасть B · +180°</text>
  <text x="875" y="840" class="small">до 150 мм · 20 APA102</text>
  <text x="875" y="874" class="small">DATA: 330–470 Ом</text>
  <text x="875" y="908" class="small">CLOCK: 330–470 Ом</text>

  <path d="M1240 225 H1370 V535 H325" class="power"/>
  <text x="1260" y="213" class="small">5V_ROTOR</text>
  <path d="M1240 275 H1410 V980 H55" class="gnd"/>
  <text x="1260" y="263" class="small">GND_ROTOR</text>
  <path d="M325 676 H425" class="signal"/>
  <path d="M325 710 H425" class="signal"/>
  <path d="M325 744 H425" class="signal"/>
  <path d="M325 778 H425" class="signal"/>
  <path d="M325 800 H390 V500 H1280 V318 H1240" class="signal thin"/>
  <text x="405" y="490" class="small">ESC_PWM_ROTOR</text>
  <path d="M725 650 H850" class="signal"/>
  <path d="M725 685 H850" class="signal"/>
  <path d="M725 810 H850" class="signal"/>
  <path d="M725 845 H850" class="signal"/>
  <path d="M325 900 H365 V760 H325" class="signal thin"/>

  <rect x="1210" y="570" width="325" height="210" class="warn"/>
  <text x="1235" y="610" class="label">До вращения обязательно</text>
  <text x="1235" y="648" class="small">• измерить ток и сопротивление кольца</text>
  <text x="1235" y="681" class="small">• ограничить LED-ток программно</text>
  <text x="1235" y="714" class="small">• проверить Hall и PWM осциллографом</text>
  <text x="1235" y="747" class="small">• балансировка + закрытый кожух</text>

  <text x="55" y="1020" class="small">Схема концептуальная. Физические цвета проводов и маркировку модулей проверять мультиметром перед пайкой.</text>
</svg>
