[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPOV_DISPLAY_ENABLED=0
  -DENABLE_ESC_ACTIVE_TEST=0

; Компилируемая проектная конфигурация со всеми функциями. Она не является
; разрешением подключать мотор или вращать ротор без завершения протоколов.
[env:esp32dev-final]
extends = env:esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPOV_DISPLAY_ENABLED=1
  -DENABLE_ESC_ACTIVE_TEST=1

; Separate low-speed motor bench firmware for the stationary Rev C board.
; It builds only src/esc_bench/main.cpp, starts at 1000 us, and accepts
; RUN only after an ARM command while the physical ARM button is held.
[env:esc-bench]
extends = env:esp32dev
build_src_filter =
  -<*>
  +<esc_bench/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DESC_BENCH_FIRMWARE=1

; Current stationary controller: ESP32-C3 SuperMini.
; GPIO6 is jumpered directly to J3.3 after R1 was removed.
; GPIO20 = ARM button, GPIO21 = STOP button.
[env:esc-bench-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<esc_bench/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DESC_BENCH_FIRMWARE=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Final stationary controller. It is functionally identical to the proven
; button-controlled ESC firmware, but uses its own build target for release.
[env:stationary-final-c3]
extends = env:esc-bench-c3
build_src_filter =
  -<*>
  +<stationary_final/main.cpp>

; Rotor-board functional test: GPIO4/GPIO5 drive the inputs of SN74AHCT125.
; It runs an autonomous single-pixel APA102 chase at low current.
[env:rotor-led-test-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<rotor_led_test/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Final rotor controller. GPIO4/5 drive DATA/CLOCK through SN74AHCT125;
; GPIO6 receives the 3.3 V Hall index signal.
[env:rotor-final-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<rotor_final/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
