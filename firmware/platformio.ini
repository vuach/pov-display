[platformio]
default_envs = stationary-final-c3, rotor-final-c3

; Неподвижный контроллер ESP32-C3 SuperMini.
; GPIO6 is jumpered directly to J3.3 after R1 was removed.
; GPIO20 = ARM button, GPIO21 = STOP button.
[env:stationary-final-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<stationary_final/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Роторный контроллер. GPIO4/5 drive DATA/CLOCK through SN74AHCT125;
; GPIO6 receives the 3.3 V Hall index signal.
[env:rotor-final-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<rotor_final/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
