[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPOV_DISPLAY_ENABLED=0
  -DENABLE_ESC_ACTIVE_TEST=0

; Компилируемая проектная конфигурация со всеми функциями. Она не является
; разрешением подключать мотор или вращать ротор без завершения протоколов.
[env:esp32dev-final]
extends = env:esp32dev
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DPOV_DISPLAY_ENABLED=1
  -DENABLE_ESC_ACTIVE_TEST=1

; Separate low-speed motor bench firmware for the stationary Rev C board.
; It builds only src/esc_bench/main.cpp, starts at 1000 us, and accepts
; RUN only after an ARM command while the physical ARM button is held.
[env:esc-bench]
extends = env:esp32dev
build_src_filter =
  -<*>
  +<esc_bench/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DESC_BENCH_FIRMWARE=1

; Current stationary controller: ESP32-C3 SuperMini.
; GPIO6 is jumpered directly to J3.3 after R1 was removed.
; GPIO20 = ARM button, GPIO21 = STOP button.
[env:esc-bench-c3]
platform = espressif32@6.8.1
board = esp32-c3-devkitm-1
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 115200
build_src_filter =
  -<*>
  +<esc_bench/main.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DESC_BENCH_FIRMWARE=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
